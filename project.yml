name: MLXChat
options:
  bundleIdPrefix: com.zautke
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  MLXChatPackages:
    path: Packages/MLXChatPackages

targets:
  MLXChat:
    type: application
    platform: iOS
    sources:
      - path: MLXChat
    dependencies:
      - package: MLXChatPackages
        product: MLXChatCore
      - package: MLXChatPackages
        product: MLXChatEngineMLX
      - package: MLXChatPackages
        product: MLXChatEngineLlama
      - package: MLXChatPackages
        product: MLXChatServer
      - package: MLXChatPackages
        product: MLXChatRAG
    entitlements:
      path: MLXChat/App/MLXChat.entitlements
    info:
      path: MLXChat/App/Info.plist
      properties:
        CFBundleDisplayName: MLXChat
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "MLXChat uses your microphone for on-device voice dictation. Your voice never leaves the device."
        NSSpeechRecognitionUsageDescription: "MLXChat transcribes your speech entirely on-device."
        UIBackgroundModes:
          - audio
          - fetch
        ITSAppUsesNonExemptEncryption: false
        UIRequiredDeviceCapabilities:
          - arm64
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zautke.mlxchat
        DEVELOPMENT_TEAM: 52AA89AC9T
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        SWIFT_ENABLE_CXX_INTEROP: YES
        OTHER_SWIFT_FLAGS: "-cxx-interoperability-mode=default"
        CLANG_CXX_LANGUAGE_STANDARD: gnu++17
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        TARGETED_DEVICE_FAMILY: "2"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: arm64 x86_64
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
